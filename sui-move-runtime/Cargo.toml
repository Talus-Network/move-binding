[package]
name = "talus-sui-move-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Runtime layer for typed Move interactions on Sui with automatic handle updates."
readme = "README.md"
publish = ["crates-io"]
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/talus-sui-move-runtime"
keywords = ["sui", "move", "blockchain", "transactions", "talus"]
categories = ["api-bindings", "development-tools"]

[dependencies]
thiserror = { workspace = true }
sui-sdk-types = { workspace = true }
serde = { workspace = true }
talus-sui-move = { workspace = true }
talus-sui-move-call = { workspace = true }
talus-sui-move-ptb = { workspace = true }
sui-rpc = { workspace = true }
sui-crypto = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
talus-sui-move = { workspace = true, features = ["derive"] }
