[package]
name = "talus-sui-move-derive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Procedural macros for typed Move structs."
readme = "README.md"
publish = ["crates-io"]
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/talus-sui-move-derive"
keywords = ["sui", "move", "blockchain", "proc-macro", "talus"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }

# This development dependency uses only a path and compiles the macro examples locally.
# Cargo omits it from the published package manifest.
[dev-dependencies]
talus-sui-move = { path = "../sui-move" }
