[package]
name = "talus-sui-move-call"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Typed call arguments and call specifications for Move calls on Sui."
readme = "README.md"
publish = ["crates-io"]
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/talus-sui-move-call"
keywords = ["sui", "move", "blockchain", "transactions", "talus"]
categories = ["api-bindings", "development-tools"]

[dependencies]
talus-sui-move = { workspace = true }
serde = { workspace = true }
bcs = { workspace = true }
thiserror = { workspace = true }
sui-sdk-types = { workspace = true }

[dev-dependencies]
talus-sui-move = { workspace = true, features = ["derive"] }
