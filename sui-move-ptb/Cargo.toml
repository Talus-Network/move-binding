[package]
name = "talus-sui-move-ptb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Programmable transaction builder for typed Move calls on Sui."
readme = "README.md"
publish = ["crates-io"]
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/talus-sui-move-ptb"
keywords = ["sui", "move", "blockchain", "transactions"]
categories = ["api-bindings", "development-tools"]

[dependencies]
talus-sui-move = { workspace = true }
talus-sui-move-call = { workspace = true }
sui-sdk-types = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
talus-sui-move = { workspace = true, features = ["derive"] }
